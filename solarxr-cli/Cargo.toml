[package]
name = "solarxr-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
eyre = "0.6.14"
serde_json = "1.0.151"
tokio = { version = "1.53.1" }
solarxr-common = { path = "../solarxr-common" }
solarxr-client = { path = "../solarxr-client" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
solarxr-common = { path = "../solarxr-common" }
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
